name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt ruff pip-audit bandit
      - run: python -m unittest discover -v
      - run: ruff check . --select F,E9,BLE,RUF100
      - run: bandit -q -r app.py config_store.py argus_core.py
      - run: python -m compileall -q app.py config_store.py argus_core.py
      - run: pip-audit -r requirements.txt
      - run: ARGUS_ALLOWED_ORIGINS=https://upstream.example.internal docker compose config
