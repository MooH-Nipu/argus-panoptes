<style>
  :root{color-scheme:dark;--bg:#05080d;--panel:#0a1119;--panel2:#070c12;--line:#18263a;--line2:#26384f;--text:#dbe7f3;--muted:#8499ad;--faint:#5b7086;--green:#3cffa0;--amber:#ffb547;--red:#ff5d6c;--cyan:#4fd1ff;--accent:var(--cyan);--mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;--sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;min-height:100vh;color:var(--text);font:14px/1.5 var(--sans);background:radial-gradient(1100px 560px at 85% -10%,rgba(79,209,255,.09),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(60,255,160,.07),transparent 60%),linear-gradient(rgba(120,170,220,.045) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(120,170,220,.045) 1px,transparent 1px) 0 0/34px 34px,var(--bg)}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
  a{color:var(--cyan)}
  .mono{font-family:var(--mono)}
  .eyebrow{margin:0 0 6px;font:700 10px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .eyebrow::before{content:"// ";opacity:.55}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;background:rgba(5,8,13,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
  .logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:conic-gradient(from 210deg,var(--green),var(--cyan),var(--green));color:#03110a;font:800 13px var(--mono);box-shadow:0 0 18px rgba(60,255,160,.35)}
  .brand b{display:block;font:800 13px/1.1 var(--mono);letter-spacing:.12em}
  .brand small{display:block;color:var(--faint);font:11px var(--mono)}
  .cursor{display:inline-block;width:7px;height:12px;margin-left:3px;vertical-align:-1px;background:var(--green);animation:blink 1.1s steps(1) infinite}
  .nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line2);border-radius:999px;background:var(--panel2);color:var(--muted);font:11px var(--mono);white-space:nowrap}
  .panel{position:relative;padding:18px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),var(--panel)}
  .panel::before{content:"";position:absolute;inset:-1px;border-radius:12px;padding:1px;pointer-events:none;background:linear-gradient(135deg,var(--accent),transparent 28%,transparent 72%,var(--accent));opacity:.45;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .panel h2{margin:0 0 14px;font-size:15px;font-weight:650}
  label,.label{display:block;margin-bottom:6px;color:#b9c8d8;font:600 11px var(--mono);letter-spacing:.04em}
  input[type=text],input[type=password],input[type=number],select{width:100%;min-height:40px;padding:8px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--text);font:13px var(--mono);transition:border-color .15s,box-shadow .15s}
  input::placeholder{color:var(--faint)}
  input:hover,select:hover{border-color:#3a5170}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  button:focus-visible,a:focus-visible,summary:focus-visible,.switch:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border:1px solid var(--line2);border-radius:8px;background:#0f1924;color:var(--text);font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s}
  .btn:hover{background:#142231}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.go{border-color:var(--green);background:#3cffa0;color:#00140a;box-shadow:0 0 22px rgba(60,255,160,.25)}
  .btn.go:hover{box-shadow:0 0 30px rgba(60,255,160,.4)}
  .btn.bad{border-color:#5d2a33;background:#22111a;color:#ffc2c9}
  .btn.bad:hover{background:#2e1520}
  .btn.sm{min-height:32px;padding:5px 11px;font-size:11px}
  .switch{appearance:none;-webkit-appearance:none;position:relative;flex:none;width:42px;height:24px;min-height:24px;margin:0;border:1px solid #3a5170;border-radius:999px;background:#101b27;cursor:pointer;transition:background .2s,border-color .2s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:left .2s,background .2s,box-shadow .2s}
  .switch:checked{border-color:var(--green);background:rgba(60,255,160,.14)}
  .switch:checked::after{left:21px;background:var(--green);box-shadow:0 0 10px var(--green)}
  .switch.danger:checked{border-color:var(--red);background:rgba(255,93,108,.16)}
  .switch.danger:checked::after{background:var(--red);box-shadow:0 0 12px var(--red)}
  .alert{margin:0 0 16px;padding:11px 14px;border:1px solid #6d2a35;border-left:3px solid var(--red);border-radius:8px;background:#1d0d13;color:#ffc2c9;font-size:13px}
  .alert{overflow-wrap:anywhere}
  .alert[hidden]{display:none}
  .arw{font-family:var(--sans);font-size:1.15em;line-height:1}
  .hint{margin:6px 0 0;color:#7c91a6;font-size:11px}
  @keyframes blink{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:760px){.topbar{position:static;flex-direction:column;align-items:flex-start;padding:12px 14px}.btn,input:not(.switch),select{min-height:44px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
